name: Build feature installer (Record + Editor + ClearCast)

# Builds the Record/Editor/ClearCast branch into a full Windows installer (native
# .NET engine + bundled FFmpeg/RNNoise) and uploads it as a downloadable artifact,
# so testers can grab a build that actually has the new tabs from the Actions UI.
on:
  push:
    branches:
      - cursor/video-recording-clip-editing-tabs-7087
  workflow_dispatch:

jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install npm dependencies
        run: npm ci

      - name: Publish engine and Vite app
        run: npm run build

      - name: Verify Record/Editor bundle is present
        shell: pwsh
        run: |
          $js = Get-ChildItem -Path (Join-Path $PWD 'dist/assets') -Filter '*.js' | Select-Object -First 1
          if (-not $js) { throw 'Vite bundle not found' }
          $content = Get-Content $js.FullName -Raw
          if ($content -notmatch 'ClearCast') {
            throw 'Bundle is missing ClearCast — wrong branch built'
          }
          Write-Host 'ClearCast/Record/Editor bundle OK'

      - name: Package Windows installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --win nsis --publish never --config.directories.output=release

      - name: Write checksums
        id: pack
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = Get-ChildItem -Path (Join-Path $PWD 'release') -Filter '*-Setup-*.exe' |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer exe was not found in release/' }
          $hash = (Get-FileHash -Algorithm SHA256 $installer.FullName).Hash.ToLower()
          "$hash  $($installer.Name)" | Set-Content -Path (Join-Path $PWD 'release/SHA256SUMS.txt') -Encoding ASCII
          Write-Host "Installer: $($installer.Name) ($([math]::Round($installer.Length / 1MB, 1)) MB), version $version"
          Get-Content (Join-Path $PWD 'release/SHA256SUMS.txt')
          echo "version=$version" >> $env:GITHUB_OUTPUT

      - uses: actions/upload-artifact@v4
        with:
          name: Blur-Sounds-${{ steps.pack.outputs.version }}-Setup-RecordEditor
          path: |
            release/*-Setup-*.exe
            release/*-Setup-*.exe.blockmap
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
