<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 64 64" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="logo-bg" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="logo-wave" x1="12" y1="32" x2="52" y2="32" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8b5cf6"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="logo-blur" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <filter id="logo-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#logo-bg)"/>
  <g filter="url(#logo-blur)" opacity="0.85">
    <rect x="14" y="24" width="5" height="16" rx="2.5" fill="url(#logo-wave)"/>
    <rect x="22" y="18" width="5" height="28" rx="2.5" fill="url(#logo-wave)"/>
    <rect x="30" y="12" width="5" height="40" rx="2.5" fill="url(#logo-wave)"/>
    <rect x="38" y="20" width="5" height="24" rx="2.5" fill="url(#logo-wave)"/>
    <rect x="46" y="26" width="5" height="12" rx="2.5" fill="url(#logo-wave)"/>
  </g>
  <g filter="url(#logo-glow)" opacity="0.55">
    <rect x="14" y="24" width="5" height="16" rx="2.5" fill="#c4b5fd"/>
    <rect x="22" y="18" width="5" height="28" rx="2.5" fill="#c4b5fd"/>
    <rect x="30" y="12" width="5" height="40" rx="2.5" fill="#c4b5fd"/>
    <rect x="38" y="20" width="5" height="24" rx="2.5" fill="#c4b5fd"/>
    <rect x="46" y="26" width="5" height="12" rx="2.5" fill="#c4b5fd"/>
  </g>
</svg>
